services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arb
      POSTGRES_USER: arb
      POSTGRES_PASSWORD: arb
    volumes:
      - arb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arb -d arb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://arb:arb@postgres:5432/arb
      BACKEND_PROXY_SECRET: ${BACKEND_PROXY_SECRET:?Set BACKEND_PROXY_SECRET in .env}
      MARKET_DATA_MODE: ${MARKET_DATA_MODE:-demo}
      BITOPRO_TAKER_FEE_BPS: ${BITOPRO_TAKER_FEE_BPS:-10}
      OKX_TAKER_FEE_BPS: ${OKX_TAKER_FEE_BPS:-10}
      MAX_BOOK_AGE_MS: ${MAX_BOOK_AGE_MS:-5000}
      MAX_TRIANGLE_SKEW_MS: ${MAX_TRIANGLE_SKEW_MS:-2500}
      MAX_CROSS_SKEW_MS: ${MAX_CROSS_SKEW_MS:-2500}
      AUTO_SIMULATION_SIZE_BTC: ${AUTO_SIMULATION_SIZE_BTC:-0.001}
      AUTO_SIMULATION_SIZE_TWD: ${AUTO_SIMULATION_SIZE_TWD:-10000}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    environment:
      BACKEND_PROXY_SECRET: ${BACKEND_PROXY_SECRET:?Set BACKEND_PROXY_SECRET in .env}
    depends_on:
      - api

volumes:
  arb-postgres:

